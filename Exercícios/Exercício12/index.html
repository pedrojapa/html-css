<!DOCTYPE html>
<html lang="ptt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospdados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video poster="imagens/limoes-capa.png" controls width="560" loop autoplay>
        <source src="mídias/meu-videooriginal.mp4" type="video/mp4">
        <source src="mídias/meu-video.mp4" type="video/mp4">
        <source src="mídias/meu-video.webm" type="video/webm">
        <source src="mídias/meu-video.ogv" type="video/ogg">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
    </video> <!-- A ordem tem influência na ordem de reprodução. -->
<hr>
    <h1>Inserindo vídeos do YouTube</h1>
    <p>Este vídeo está hospedado no YouTube</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/FdE5G95B7Mg?si=2zAvPVfc5O-vG9RT" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
<hr>
    <h1>Inserindo vídeos do Vimeo</h1>
    <p>Este  vídeo está hospedado no Vimeo</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/FdE5G95B7Mg?si=2zAvPVfc5O-vG9RT" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <hr>
</body>
</html>
